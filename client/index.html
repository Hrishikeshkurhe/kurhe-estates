<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Primary SEO -->
    <title>
      Kurhe Estates | Infinia Premium 3 BHK Residences in Amravati
    </title>

    <meta
      name="description"
      content="Kurhe Estates presents Infinia, premium 3 BHK residences in Amravati, Maharashtra. Discover thoughtfully designed luxury homes, modern amenities and elegant living."
    />

    <meta
      name="keywords"
      content="Kurhe Estates, Kurhe Estates Amravati, Kurhe Estates Infinia, Infinia Amravati, real estate in Amravati, real estate developers in Amravati, 3 BHK flats in Amravati, luxury apartments in Amravati, premium residences Amravati"
    />

    <meta name="robots" content="index, follow" />

    <link
      rel="canonical"
      href="https://kurheestates.com/"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      href="/assets/logo5.png"
    />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Open Graph / Social Sharing -->
    <meta
      property="og:title"
      content="Kurhe Estates | Infinia - Premium Residences in Amravati"
    />

    <meta
      property="og:description"
      content="Discover Infinia by Kurhe Estates — premium 3 BHK residences designed for refined living in Amravati, Maharashtra."
    />

    <meta
      property="og:url"
      content="https://kurheestates.com/"
    />

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:site_name"
      content="Kurhe Estates"
    />

    <meta
      property="og:image"
      content="https://kurheestates.com/assets/logo5.png"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Kurhe Estates | Infinia - Premium Residences in Amravati"
    />

    <meta
      name="twitter:description"
      content="Premium 3 BHK residences by Kurhe Estates in Amravati, Maharashtra."
    />

    <meta
      name="twitter:image"
      content="https://kurheestates.com/assets/logo5.png"
    />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "RealEstateAgent",
        "name": "Kurhe Estates",
        "url": "https://kurheestates.com/",
        "logo": "https://kurheestates.com/assets/logo5.png",
        "description": "Kurhe Estates is a real estate company in Amravati, Maharashtra, presenting premium residential projects including Infinia.",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Amravati",
          "addressRegion": "Maharashtra",
          "addressCountry": "IN"
        },
        "areaServed": {
          "@type": "City",
          "name": "Amravati"
        }
      }
    </script>

    <!-- Styles -->

  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
