<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kurhe Estates — Infinia | The New Standard of Imperial Living</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
/* ============ TOKENS ============ */
:root{
  --ink:        #0B0A08;
  --charcoal:   #15130F;
  --panel:      #1C1914;
  --panel-2:    #211D17;
  --gold:       #B8935C;
  --gold-bright:#E3C08C;
  --copper:     #C1785A;
  --ivory:      #F3ECE1;
  --stone:      #93897A;
  --hairline:   rgba(184,147,92,0.22);
  --serif: 'Playfair Display', Georgia, serif;
  --sans:  'Jost', -apple-system, BlinkMacSystemFont, sans-serif;
  --mono:  'JetBrains Mono', monospace;
}

*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  background:var(--ink);
  color:var(--ivory);
  font-size:18px;
  font-family:var(--sans);
  font-weight:300;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%;display:block;}
a{color:inherit;text-decoration:none;}
h1,h2,h3,h4,h5{font-family:var(--serif);font-weight:500;margin:0 0 .5em;color:var(--ivory);letter-spacing:.01em;}
p{margin:0 0 1em;color:var(--stone);}
.eyebrow{
  font-family:var(--mono);
  font-size:.72rem;
  letter-spacing:.28em;
  text-transform:uppercase;
  color:var(--gold);
  margin-bottom:1em;
}
ul{list-style:none;margin:0;padding:0;}
button{font-family:var(--sans);cursor:pointer;}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
  html{scroll-behavior:auto;}
}

/* ============ SCROLL PROGRESS SIGNATURE MARK ============ */
.progress-mark{
  position:fixed;
  top:14px; right:20px;
  z-index:1000;
  width:64px; height:32px;
  opacity:.9;
  pointer-events:none;
}
.progress-svg{width:100%;height:100%;}
.progress-svg .bar{
  fill:var(--gold);
  transform-origin:bottom;
  transform:scaleY(0);
  transition:transform .4s ease;
}

/* ============ NAV ============ */
.nav{
  position:fixed; top:0; left:0; right:0; z-index:900;
  padding:22px 0;
  transition:background .35s ease, padding .35s ease, border-color .35s ease;
  border-bottom:1px solid transparent;
}
.nav.scrolled{
  background:rgba(11,10,8,.86);
  backdrop-filter:blur(14px);
  padding:14px 0;
  border-bottom:1px solid var(--hairline);
}
.nav-inner{
  max-width:1280px; margin:0 auto; padding:0 32px;
  display:flex; align-items:center; justify-content:space-between;
}
.nav-brand{display:flex;align-items:center;gap:12px;}
.nav-logo {
    width: 300px;
    height: 65px;
    object-fit: cover;
    object-position: center;
    display: block;
}
.nav-brand-text{font-family:var(--serif);font-size:1.95rem;letter-spacing:.06em;}
.nav-brand-text em{font-style:normal;color:var(--gold);}
.nav-links{display:flex;align-items:center;gap:34px;font-size:1.15rem;letter-spacing:.04em;}
.nav-links a{color:var(--ivory);opacity:.8;transition:opacity .2s;position:relative;}
.nav-links a:hover{opacity:1;}
.nav-cta{
  border:1px solid var(--gold);
  padding:9px 20px;
  border-radius:2px;
  opacity:1 !important;
  color:var(--gold-bright) !important;
}
.nav-cta:hover{background:var(--gold);color:var(--ink) !important;}
.nav-burger{display:none;background:none;border:0;width:28px;height:20px;flex-direction:column;justify-content:space-between;}
.nav-burger span{display:block;height:1px;background:var(--ivory);}

/* ============ HERO ============ */
.hero{
  position:relative;
  min-height:100vh;
  display:flex;
  align-items:flex-end;
  overflow:hidden;
  background:var(--ink);
}
.hero-media{position:absolute;inset:0;}
.hero-media img{width:100%;height:100%;object-fit:cover;object-position:top center;opacity:.9;}
.hero-scrim{
  position:absolute;inset:0;
  background:linear-gradient(180deg, rgba(11,10,8,.55) 0%, rgba(11,10,8,.35) 40%, rgba(11,10,8,.96) 100%);
}
.hero-content{
  position:relative; z-index:2;
  max-width:1280px; margin:0 auto;
  padding:0 32px 100px;
  width:100%;
}
.hero-title{display:flex;flex-direction:column;gap:.15em;}
.skyline-word{
  font-size:clamp(3.2rem, 9vw, 7rem);
  color:var(--gold-bright);
  line-height:.95;
}
.hero-sub{
  font-family:var(--serif);
  font-style:italic;
  font-size:clamp(2.1rem, 2.4vw, 1.6rem);
  color:var(--ivory);
  font-weight:400;
}
.hero-desc{max-width:520px;font-size:1.02rem;margin-top:1.2em;}
.hero-actions{display:flex;gap:16px;margin-top:1.6em;flex-wrap:wrap;}

.btn{
  display:inline-block;
  padding:15px 30px;
  font-size:.82rem;
  letter-spacing:.14em;
  text-transform:uppercase;
  border-radius:2px;
  transition:all .25s ease;
  border:1px solid transparent;
}
.btn-solid{background:var(--gold);color:var(--ink);}
.btn-solid:hover{background:var(--gold-bright);transform:translateY(-2px);}
.btn-ghost{border-color:var(--hairline);color:var(--ivory);}
.btn-ghost:hover{border-color:var(--gold);color:var(--gold-bright);}
.btn.full{width:100%;text-align:center;border:0;}

.hero-skyline{position:absolute;right:5%;bottom:0;width:340px;opacity:.5;z-index:1;pointer-events:none;}
.skyline-svg .skybar{fill:none;stroke:var(--gold);stroke-width:1;opacity:.55;}

/* ============ MARQUEE ============ */
.marquee{
  border-top:1px solid var(--hairline);
  border-bottom:1px solid var(--hairline);
  overflow:hidden;
  background:var(--charcoal);
  padding:16px 0;
}
.marquee-track{
  display:flex; gap:28px; white-space:nowrap;
  width:max-content;
  animation:scrollMarquee 32s linear infinite;
  font-family:var(--mono);
  font-size:.78rem;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--stone);
}
.marquee-track span:nth-child(2n){color:var(--gold);}
@keyframes scrollMarquee{
  from{transform:translateX(0);}
  to{transform:translateX(-50%);}
}

/* ============ SPLIT SECTIONS ============ */
.split{
  display:grid;
  grid-template-columns:1.05fr 1fr;
  min-height:80vh;
}
.split.rev{grid-template-columns:1fr 1.05fr;}
.split.rev .split-media{order:2;}
.split.rev .split-copy{order:1;}
.split-media{position:relative;overflow:hidden;}
.split-media img{width:100%;height:100%;object-fit:cover;min-height:420px;}
.split-copy{
  display:flex;flex-direction:column;justify-content:center;
  padding:80px 64px;
  background:var(--charcoal);
}
.split-copy h2{font-size:clamp(1.8rem,3vw,2.6rem);}
.split-copy p{max-width:460px;}

.stat-row{display:flex;gap:40px;margin-top:1.4em;padding-top:1.4em;border-top:1px solid var(--hairline);}
.stat-row li{display:flex;flex-direction:column;}
.stat-row strong{font-family:var(--serif);font-size:2rem;color:var(--gold-bright);}
.stat-row span{font-family:var(--mono);font-size:.88rem;letter-spacing:.12em;text-transform:uppercase;color:var(--stone);margin-top:.3em;}

/* ============ GENERIC SECTION ============ */
.section{padding:120px 32px;max-width:1280px;margin:0 auto;}
.section.dark{background:var(--panel);max-width:none;padding:120px 0;}
.section.dark .section-head,
.section.dark .split{max-width:1280px;margin:0 auto;}
.section.dark .split{background:transparent;min-height:auto;}
.section.dark .split-copy{background:transparent;padding:0 64px;}
.section-head{max-width:640px;margin-bottom:64px;}
.section-head h2{font-size:clamp(1.86rem,3vw,2.6rem);}
.section-lede{font-size:1.50rem;}

/* ============ TABS (floor plans) ============ */
.tabs{display:flex;gap:10px;margin-bottom:36px;flex-wrap:wrap;border-bottom:1px solid var(--hairline);}
.tab-btn{
  background:none;border:0;color:var(--stone);
  padding:14px 4px;margin-right:26px;
  font-size:.95rem;letter-spacing:.06em;
  border-bottom:2px solid transparent;
  transition:color .2s, border-color .2s;
}
.tab-btn.active,.tab-btn:hover{color:var(--gold-bright);border-color:var(--gold);}
.tab-panel{display:none;border:1px solid var(--hairline);}
.tab-panel.active{display:block;}

.vastu-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:1px;
  background:var(--hairline);margin-top:64px;border:1px solid var(--hairline);
}
.vastu-card{background:var(--ink);padding:32px;}
.vastu-dir{font-family:var(--mono);font-size:.7rem;letter-spacing:.14em;color:var(--copper);}
.vastu-card h4{margin:.6em 0 .4em;font-size:1.85rem;}
.vastu-card p{font-size:1.28rem;margin:0;}

.dims{display:grid;grid-template-columns:repeat(3,1fr);gap:40px;margin-top:64px;padding-top:40px;border-top:1px solid var(--hairline);}
.dims h5{font-family:var(--mono);font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:1em;}
.dims p{font-size:.92rem;margin:0 0 .6em;color:var(--ivory);opacity:.85;}

/* ============ BANNER ============ */
.banner{position:relative;height:60vh;overflow:hidden;}
.banner img{width:100%;height:100%;object-fit:cover;filter:brightness(.5) saturate(.9);}
.banner-text{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 64px;max-width:1280px;margin:0 auto;left:0;right:0;}
.banner-text h2{font-size:clamp(2rem,4vw,3.2rem);}

/* ============ SPECS ============ */
.specs-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--hairline);border:1px solid var(--hairline);}
.spec-card{background:var(--ink);padding:34px 28px;}
.spec-card h4{font-size:1.80rem;color:var(--gold-bright);margin-bottom:.5em;}
.spec-card p{font-size:1.16rem;margin:0;}

/* ============ AMENITIES ============ */
.amen-list{display:grid;grid-template-columns:1fr 1fr;padding:80px 64px;gap:0;background:transparent;align-content:center;}
.amen-item{
  display:flex;align-items:baseline;gap:14px;
  padding:16px 0;border-bottom:1px solid var(--hairline);
  font-size:.95rem;color:var(--ivory);
}
.amen-item span{font-family:var(--mono);color:var(--copper);font-size:.75rem;}

/* ============ LOCATION ============ */
.connect-list{margin-top:1.6em;border-top:1px solid var(--hairline);}
.connect-list li{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--hairline);font-size:.92rem;}
.connect-list em{font-style:normal;font-family:var(--mono);color:var(--gold);}

/* ============ CREDITS ============ */
.credits{padding:60px 32px;border-top:1px solid var(--hairline);border-bottom:1px solid var(--hairline);}
.credits-inner{max-width:1280px;margin:0 auto;display:flex;flex-wrap:wrap;gap:40px;justify-content:space-between;}
.credit h5{font-family:var(--mono);font-size:.65rem;letter-spacing:.14em;text-transform:uppercase;color:var(--stone);margin-bottom:.4em;font-weight:400;}
.credit p{margin:0;color:var(--ivory);font-size:.9rem;}

/* ============ CONTACT ============ */
.contact{padding:120px 32px;max-width:1280px;margin:0 auto;}
.contact-inner{display:grid;grid-template-columns:1fr 1fr;gap:80px;}
.contact-copy h2{font-size:clamp(1.8rem,3vw,2.6rem);}
.contact-detail{padding:16px 0;border-bottom:1px solid var(--hairline);}
.contact-detail span{display:block;font-family:var(--mono);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--stone);margin-bottom:.4em;}
.contact-detail a{color:var(--gold-bright);font-size:1rem;}
.contact-detail p{margin:0;color:var(--ivory);font-size:.95rem;}

.contact-form{background:var(--charcoal);border:1px solid var(--hairline);padding:44px;}
.form-row{margin-bottom:20px;}
.form-row label{display:block;font-family:var(--mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--stone);margin-bottom:8px;}
.form-row input, .form-row textarea{
  width:100%;background:var(--panel);border:1px solid var(--hairline);color:var(--ivory);
  padding:12px 14px;font-family:var(--sans);font-size:.95rem;border-radius:2px;
  transition:border-color .2s;
}
.form-row input:focus, .form-row textarea:focus{outline:none;border-color:var(--gold);}
.form-note{font-family:var(--mono);font-size:.7rem;color:var(--stone);margin-top:14px;text-align:center;}
.form-note code{color:var(--copper);}

/* ============ FOOTER ============ */
.footer{background:var(--ink);border-top:1px solid var(--hairline);padding:56px 32px 32px;}
.footer-inner{max-width:1280px;margin:0 auto;text-align:center;}
.footer-brand{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:24px;}
.footer-brand img{width:250px;height:58px;border-radius:50%;object-fit:cover;}
.footer-brand p{margin:0;font-family:var(--serif);letter-spacing:.12em;color:var(--ivory);}
.footer-disclaimer{max-width:720px;margin:0 auto 20px;font-size:.75rem;color:var(--stone);opacity:.7;}
.footer-copy{font-size:.75rem;color:var(--stone);margin:0;}

/* ============ REVEAL ANIMATION ============ */
.reveal, .reveal-left, .reveal-right{
  opacity:0;
  transition:opacity .9s ease, transform .9s ease;
}
.reveal{transform:translateY(28px);}
.reveal-left{transform:translateX(-32px);}
.reveal-right{transform:translateX(32px);}
.reveal.in, .reveal-left.in, .reveal-right.in{opacity:1;transform:none;}

/* ============ RESPONSIVE ============ */
@media (max-width: 900px){
  .nav-links{position:fixed;top:0;right:-100%;height:100vh;width:78%;background:var(--charcoal);flex-direction:column;justify-content:center;align-items:flex-start;padding:0 40px;transition:right .35s ease;border-left:1px solid var(--hairline);}
  .nav-links.open{right:0;}
  .nav-burger{display:flex;}
  .split, .split.rev{grid-template-columns:1fr;}
  .split.rev .split-media{order:1;}
  .split.rev .split-copy{order:2;}
  .split-copy{padding:56px 28px;}
  .split-media img{min-height:300px;}
  .vastu-grid{grid-template-columns:1fr 1fr;}
  .dims{grid-template-columns:1fr;gap:24px;}
  .specs-grid{grid-template-columns:1fr 1fr;}
  .amen-list{grid-template-columns:1fr;padding:48px 28px;}
  .contact-inner{grid-template-columns:1fr;gap:48px;}
  .hero-skyline{display:none;}
  .progress-mark{width:44px;height:22px;top:10px;right:12px;}
}
@media (max-width:560px){
  .vastu-grid{grid-template-columns:1fr;}
  .specs-grid{grid-template-columns:1fr;}
  .section{padding:80px 22px;}
  .contact{padding:80px 22px;}
  .contact-form{padding:28px;}
}

</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
